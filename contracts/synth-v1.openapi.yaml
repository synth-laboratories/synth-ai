            status: 400
            detail: The terms version is not one the server publishes.
            instance: urn:request:example
            code: terms_version_unknown
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    IdempotencyKeyReused:
      description: idempotency key reused
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/idempotency_key_reused
            title: idempotency key reused
            status: 422
            detail: idempotency key reused
            instance: urn:request:example
            code: idempotency_key_reused
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    ResourceNotFound:
      description: resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/resource_not_found
            title: resource not found
            status: 404
            detail: resource not found
            instance: urn:request:example
            code: resource_not_found
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
  schemas:
    Limit:
      type: object
      required:
      - resource
      - metric
      - window
      - cap
      properties:
        resource:
          type: string
          description: 'e.g. container_pool, swarm_run (concurrent_runs: standard 5, max 50, internal
            -1, credits/free 1), included_usage.'
        metric:
          type: string
        window:
          type: string
        cap:
          type: number
          description: -1 means uncapped.
    Org:
      type: object
      required:
      - id
      - name
      - personal
      - plan
      - access_tier
      - created_at
      properties:
        id:
          type: string
          format: uuid
        clerk_org_id:
          type:
          - string
          - 'null'
        name:
          type: string
        personal:
          type: boolean
        plan:
          type: string
        access_tier:
          type: string
        created_at:
          type: string
          format: date-time
    Principal:
      type: object
      required:
      - org_id
      - credential_kind
      - credential_purpose
      - principal_class
      - scopes
      - permissions
      - authorization_version
      - access_tier
      properties:
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        credential_kind:
          type: string
          enum:
          - api_key
          - session
          - oauth
        credential_id:
          type: string
        credential_purpose:
          type: string
          enum:
          - personal
          - automation
          - legacy
          - oauth
        principal_class:
          type: string
        scopes:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        authorization_version:
          type: integer
          minimum: 1
        org_role:
          type: string
          enum:
          - owner
          - admin
          - member
        access_tier:
          type: string
    Account:
      type: object
      required:
      - org
      - principal
      - limits
      properties:
        org:
          $ref: '#/components/schemas/Org'
        principal:
          $ref: '#/components/schemas/Principal'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'
        terms:
          description: The org's most recently recorded terms acceptance, or null when none is recorded.
          oneOf:
          - $ref: '#/components/schemas/AccountTerms'
          - type: 'null'
    AccountTerms:
      type: object
      required:
      - version
      - accepted_at
      properties:
        version:
          type: string
        accepted_at:
          type: string
          format: date-time
    TermsAcceptanceRequest:
      type: object
      additionalProperties: false
      required:
      - version
      - accepted_at
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 64
          examples:
          - '2026-11-04'
        accepted_at:
          type: string
          format: date-time
          description: When the user accepted, ISO-8601 UTC. Recorded as claimed; the server also keeps its own time.
    TermsAcceptance:
      type: object
      required:
      - version
      - accepted_at
      - accepted_by
      - org_id
      properties:
        version:
          type: string
        accepted_at:
          type: string
          format: date-time
        accepted_by:
          type: string
          description: The accepting principal, user:<id> for a signed-in user or credential:<id> otherwise.
        org_id:
          type: string
          format: uuid
    Scope:
      type: string
      enum:
      - account:billing:read
      - account:read
      - account:usage:read
      - swarms:control
      - swarms:read
      - swarms:run
      - swarms:write
      - account:write
      - account:billing:write
      - account:limits:read
    ApiKey:
      type: object
      required:
      - key_id
      - prefix
      - last4
      - key_type
      - is_active
      - purpose
      - name
      - scopes
      - authorization_version
      - rotation_family_id
      properties:
        key_id:
          $ref: '#/components/schemas/KeyId'
        prefix:
          type: string
          description: Visible prefix; imported inventory can retain its historical prefix.
        last4:
          type: string
        key_type:
          type: string
        is_active:
          type: boolean
        purpose:
          type: string
          enum:
          - personal
          - automation
        name:
          type:
          - string
          - 'null'
        scopes:
          type: array
          items:
            type: string
        authorization_version:
          type: integer
          minimum: 1
        rotation_family_id:
          oneOf:
          - $ref: '#/components/schemas/KeyId'
          - type: 'null'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
    MintedApiKey:
      allOf:
      - $ref: '#/components/schemas/ApiKey'
      - type: object
        required:
        - key
        properties:
          key:
            type: string
            pattern: ^sk_(live|test)_[0-9a-f]{48}$
    MintApiKeyRequest:
      type: object
      additionalProperties: false
      description: Automation keys require name, scopes, expires_at (at most one year) and request_id.
        One active personal key per user and org.
      properties:
        purpose:
          type: string
          enum:
          - personal
          - automation
          default: personal
        name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
        scopes:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Scope'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        request_id:
          type:
          - string
          - 'null'
          format: uuid
    Money:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,12})?$
          examples:
          - '5.00'
        currency:
          type: string
          const: USD
    LaunchBudget:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,8})?$
          x-synth-budget: true
        currency:
          type: string
          const: USD
    Only:
      type: object
      additionalProperties: false
      required:
      - only
      properties:
        only:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    Exclude:
      type: object
      additionalProperties: false
      required:
      - exclude
      properties:
        exclude:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    RoutingConstraints:
      type: object
      additionalProperties: false
      properties:
        providers:
          oneOf:
          - $ref: '#/components/schemas/Only'
          - $ref: '#/components/schemas/Exclude'
        models:
          oneOf:
          - $ref: '#/components/schemas/Only'
          - $ref: '#/components/schemas/Exclude'
      description: Unordered hard restrictions across every managed inference actor. Provider restrictions
        include intermediaries and serving hosts. Omission leaves assignment to Synth.
    RoutingCatalogRoute:
      type: object
      additionalProperties: false
      required:
      - preset
      - model
      - providers
      properties:
        preset:
          type: string
        model:
          type: string
        providers:
          type: array
          items:
            type: string
    RoutingCatalog:
      type: object
      additionalProperties: false
      required:
      - revision
      - models
      - providers
      - routes
      properties:
        revision:
          type: string
        models:
          type: array
          items:
            type: string
        providers:
          type: array
          items:
            type: string
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RoutingCatalogRoute'
    RoutingActor:
      type: object
      additionalProperties: false
      required:
      - actor_id
      - role
      - model
      - preset
      - providers
      - profile_digest
      properties:
        actor_id:
          type: string
        role:
          type: string
        model:
          type: string
        preset:
          type: string
        profile_digest:
          type: string
        providers:
          type: array
          items:
            type: string
    RoutingReadback:
      type: object
      additionalProperties: false
      required:
      - requested
      - catalog_revision
      - policy_revision
      - request_digest
      - actors
      properties:
        requested:
          oneOf:
          - $ref: '#/components/schemas/RoutingConstraints'
          - type: 'null'
        catalog_revision:
          type: string
        policy_revision:
          type: string
        request_digest:
          type: string
        actors:
          type: array
          items:
            $ref: '#/components/schemas/RoutingActor'
    Limits:
      type: object
      additionalProperties: false
      required:
      - maximum_charge
      description: An explicit positive USD budget is required. Task and parallelism limits are service-owned.
      properties:
        maximum_charge:
          $ref: '#/components/schemas/LaunchBudget'
        wall_time_seconds:
          type: integer
          minimum: 1
          maximum: 86400
    Family:
      type: object
      required:
      - id
      - version
      - summary
      - research_binding
      - required_actor_types
      properties:
        id:
          type: string
        version:
          type: string
        summary:
          type: string
        research_binding:
          type: string
        required_actor_types:
          type: array
          items:
            type: string
    FamilyList:
      type: object
      required:
      - families
      properties:
        families:
          type: array
          items:
            $ref: '#/components/schemas/Family'
        routing:
          $ref: '#/components/schemas/RoutingCatalog'
    LaunchRequest:
      type: object
      additionalProperties: false
      required:
      - limits
      properties:
        message:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 32768
          x-synth-max-bytes: 32768
          x-synth-message-text: true
        limits:
          $ref: '#/components/schemas/Limits'
        inputs:
          type:
          - object
          - 'null'
          properties:
            files:
              type: array
              maxItems: 32
              items:
                type: object
                required:
                - file_id
                - revision_id
                - digest_sha256
                properties:
                  file_id:
                    type: string
                  revision_id:
                    type: string
                  digest_sha256:
                    type: string
                    pattern: ^[0-9a-f]{64}$
        guidance:
          type:
          - array
          - 'null'
          maxItems: 32
          description: What the run must address. The planner covers or declines each item. A metric on an
            item binds every objective derived from it, and the planner cannot change or drop it. Not accepted
            with research profiles.
          items:
            $ref: '#/components/schemas/RunGuidance'
        profile:
          type: string
          minLength: 1
          maxLength: 128
          description: Published run profile ID from GET /v1/profiles. Omit for Core's default. No silent substitution of an explicit choice.
          examples: [swarms-v2]
        research_task:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{0,127}$
          description: Required by research profiles; names this organization's approved published task. Refused for a general profile.
        resources:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/OwnerResourceRequest'
        labels:
          type: object
          additionalProperties:
            type: string
        routing:
          $ref: '#/components/schemas/RoutingConstraints'
    OwnerResourceRequest:
      type: object
      additionalProperties: false
      required: [plugin, roles, limits, selection]
      properties:
        plugin:
          type: string
          enum: [pool]
        version:
          type: integer
          const: 1
          default: 1
        roles:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [planner, worker, reviewer, run_assessor]
        limits:
          $ref: '#/components/schemas/OwnerResourceLimits'
        role_limits:
          type: object
          maxProperties: 4
          propertyNames:
            enum: [planner, worker, reviewer, run_assessor]
          additionalProperties:
            $ref: '#/components/schemas/OwnerResourceLimits'
        selection:
          type: object
      oneOf:
      - properties:
          plugin:
            const: pool
          limits:
            required: [spend_micros, rollouts]
            propertyNames:
              enum: [spend_micros, rollouts]
          selection:
            additionalProperties: false
            properties:
              pool_ids:
                type: array
                minItems: 1
                maxItems: 8
                uniqueItems: true
                items:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
    OwnerResourceLimits:
      type: object
      minProperties: 1
      maxProperties: 2
      propertyNames:
        enum: [spend_micros, rollouts, calls]
      additionalProperties:
        type: integer
        minimum: 0
        maximum: 9223372036854775807
    ControlRef:
      type: object
      required:
      - operation_id
      - command
      - state
      properties:
        operation_id:
          type: string
        command:
          type: string
          examples:
          - cancel
          - pause
          - resume
        state:
          type: string
          examples:
          - accepted
          - applied
          - quiesced
          - refused
    RunProfile:
      type: object
      additionalProperties: false
      required: [id, revision, name, description, requires_research_task, default, available]
      properties:
        id:
          type: string
        revision:
          type: string
        name:
          type: string
        description:
          type: string
        requires_research_task:
          type: boolean
        default:
          type: boolean
        available:
          type: boolean
        unavailable_reason:
          type: string
        routing:
          $ref: '#/components/schemas/RoutingCatalog'
    RunProfileCatalog:
      type: object
      additionalProperties: false
      required: [default_profile, profiles]
      properties:
        default_profile:
          type: string
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/RunProfile'
    RunProfilePin:
      type: object
      additionalProperties: false
      required: [id, revision, digest, program_id, program_version, definition_digest, actor_profiles]
      properties:
        id:
          type: string
        revision:
          type: string
        digest:
          type: string
        program_id:
          type: string
        program_version:
          type: string
        definition_digest:
          type: string
        actor_profiles:
          type: object
          additionalProperties:
            type: string
    RunSnapshot:
      type: object
      required:
      - metadata
      - run_id
      - labels
      - labels_revision
      - objectives
      - guidance_coverage
      - state
      - model
      - provider
      - result_available
      - execution_closed
      - accounting_final
      - cleanup_complete
      - problems
      - problems_observed
      - created_at
      - started_at
      - closed_at
      properties:
        metadata:
          type: object
          additionalProperties: true
        method:
          description: Open method projection or null.
        run_id:
          $ref: '#/components/schemas/RunId'
        labels:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        labels_revision:
          type: integer
        objectives:
          type:
          - array
          - 'null'
          description: The run's objectives on launch and single-run reads. Read objectives_read before treating
            an empty list as no objectives. List pages do not read them and return an empty list.
          items:
            $ref: '#/components/schemas/RunObjective'
        objectives_read:
          type: string
          enum:
          - ok
          - unavailable
          description: Whether objectives is the run's own answer. unavailable means it could not be read;
            the run read still succeeds. Absent on list pages.
        guidance_coverage:
          type:
          - array
          - 'null'
          items: {}
        state:
          type: string
          description: Known values listed; unknown values are forwarded verbatim.
          examples:
          - queued
          - running
          - pausing
          - paused
          - cancelling
          - completed
          - partial
          - failed
          - cancelled
        model:
          type: string
        provider:
          type: string
          description: The provider named at launch, or openai when none was named. It does not change as
            the run executes; the provider that served each call is on its usage record.
        result_available:
          type: boolean
          description: True when the run completed or partially completed, or when it has ended and has at
            least one output, including a run that failed or was cancelled. False while the run is open, for
            a run that ended with no output, and for an imported run.
        execution_closed:
          type: boolean
        accounting_final:
          type: boolean
          description: True only once settlement has closed the run's books; releasing a hold does not flip
            it.
        cleanup_complete:
          type: boolean
        control:
          $ref: '#/components/schemas/ControlRef'
        problems:
          type:
          - array
          - 'null'
          items: {}
        problems_observed:
          type: boolean
        failure:
          description: Open failure projection or null. Reasons include launch_not_dispatched (the worker
            found a queued run that never reached the execution service; the hold was refunded).
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
        profile:
          $ref: '#/components/schemas/RunProfilePin'
        selection:
          $ref: '#/components/schemas/RunSelection'
        routing:
          $ref: '#/components/schemas/RoutingReadback'
    RunSelection:
      type: object
      description: 'Which snapshot a research method selected and what a trusted score covers. Present on
        single-run reads, including launch; list pages omit it. Only status `selected` claims that a trusted
        score covers a snapshot this run produced. Every other status has a null incumbent, or in the case of
        `unavailable` a reason naming what cannot be shown, and none of them is a pass.'
      required:
      - status
      - reason
      - incumbent
      - evaluated
      properties:
        status:
          type: string
          description: '`not_applicable`: the run''s program does not select. `pending`: not settled yet.
            `selected`: the incumbent is bound to a scored evaluation, the stored snapshot and its commit tree.
            `no_selection`: settled, and nothing this run produced was selected. `unavailable`: settled, but
            the custody chain cannot be shown.'
          enum:
          - not_applicable
          - pending
          - selected
          - no_selection
          - unavailable
        reason:
          type:
          - string
          - 'null'
          description: Why the status holds, or null when `status` alone says it.
          enum:
          - baseline_retained
          - no_incumbent
          - settlement_open
          - incumbent_not_recorded
          - incumbent_unbound
          - custody_incomplete
          - null
        incumbent:
          description: The selected candidate. Null unless `status` is `selected`, or `unavailable` with reason
            `custody_incomplete`, where its absent facts are null.
          oneOf:
          - $ref: '#/components/schemas/SelectionCandidate'
          - type: 'null'
        evaluated:
          type: array
          description: Every evaluation of this run that finished, in the order recorded.
          items:
            $ref: '#/components/schemas/SelectionCandidate'
    SelectionCandidate:
      type: object
      required:
      - state
      - commit_sha
      - tree_sha
      - artifact_digest
      - score
      - evaluator_digest
      - evaluation_receipt
      - execution_receipt_sha256
      - candidate_files
      properties:
        state:
          type: string
          description: '`scored`, or `failed` when the scorer ran and rejected the candidate.'
          enum:
          - scored
          - failed
        commit_sha:
          type: string
          pattern: ^[0-9a-f]{40}$
        tree_sha:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{40}$
          description: The Git tree of `commit_sha`, read from the git server when the snapshot was admitted. Null when it was not recorded.
        artifact_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the snapshot archive's exact bytes.
        score:
          description: An exact ratio. Null when `state` is `failed`.
          oneOf:
          - $ref: '#/components/schemas/SelectionScore'
          - type: 'null'
        evaluator_digest:
          type: string
          description: Identity of the pinned trusted evaluator.
        evaluation_receipt:
          type: string
          description: Opaque identity of this evaluation's recorded result.
        execution_receipt_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Digest of the scorer's execution evidence. The evidence is not public, so a reader can compare this value but not recompute it.
        candidate_files:
          type:
          - array
          - 'null'
          description: The files the scorer received, by repository path, sorted by path. A score covers these files, not the whole archive. Null when not recorded.
          items:
            $ref: '#/components/schemas/SelectionFile'
    SelectionScore:
      type: object
      required:
      - numerator
      - denominator
      properties:
        numerator:
          type: integer
          minimum: 0
        denominator:
          type: integer
          minimum: 1
    SelectionFile:
      type: object
      required:
      - path
      - sha256
      properties:
        path:
          type: string
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    PageFields:
      type: object
      required:
      - has_more
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: string
          minLength: 1
    RunPage:
      allOf:
      - $ref: '#/components/schemas/PageFields'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/RunSnapshot'
    RunEvent:
      type: object
      required:
      - event_id
      - run_id
      - sequence
      - kind
      - original_kind
      - usage
      - observed_at
      - approval_id
      properties:
