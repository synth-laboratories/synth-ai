    SandboxMoment:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: pending has not happened yet. not_recorded happened but no time was kept. not_applicable
            never happens for this sandbox. unobserved could not be read.
          enum:
          - pending
          - observed
          - not_recorded
          - not_applicable
          - unobserved
        at:
          type: string
          format: date-time
          description: Present only when status is observed.
    SandboxImage:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - pending
          - resolved
          - not_applicable
          - unobserved
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Present only when status is resolved.
    RunSandbox:
      type: object
      required:
      - sandbox_id
      - role
      - provider_kind
      - state
      - image
      - cpu_millis
      - memory_bytes
      - created
      - ready
      - destroyed
      - observation
      properties:
        sandbox_id:
          type: string
          pattern: ^sbx_[A-Za-z0-9_-]{22}$
        role:
          type: string
          enum:
          - planner
          - worker
          - reviewer
          - other
        provider_kind:
          type: string
          enum:
          - docker
          - daytona
          - modal
          - exe_dev
          - unobserved
        state:
          type: string
          description: pending has no provider session yet. requested awaits a box. created has a box whose
            environment is not ready. ready serves turns. stopping has destruction requested. retained was
            deliberately kept past its session. destroyed has verified cleanup of running compute; the provider may retain inactive metadata. never_allocated and
            never_created had no box. never_started left a box object that is owed a reap, so it is not
            absent. not_requested ran without a sandbox. unobserved could not be read.
          enum:
          - pending
          - requested
          - created
          - ready
          - stopping
          - retained
          - destroyed
          - never_allocated
          - never_started
          - never_created
          - not_requested
          - unobserved
        image:
          $ref: '#/components/schemas/SandboxImage'
        cpu_millis:
          type: integer
          minimum: 0
          description: CPU requested for the sandbox, in thousandths of a core.
        memory_bytes:
          type: integer
          minimum: 0
          description: Memory requested for the sandbox.
        created:
          $ref: '#/components/schemas/SandboxMoment'
        ready:
          $ref: '#/components/schemas/SandboxMoment'
        destroyed:
          $ref: '#/components/schemas/SandboxMoment'
        observation:
          type: string
          description: current answered on this read or is final. unavailable could not be read, so the record
            is the last one retained. contradicted reported a state moving backwards, which was refused, so the
            record keeps the last legal state.
          enum:
          - current
          - unavailable
          - contradicted
        observed_at:
          type: string
          format: date-time
          description: When the source last answered. Absent only when state is unobserved.
    RunSandboxes:
      type: object
      required:
      - teardown
      - items
      properties:
        teardown:
          type: string
          description: complete has execution closed and every sandbox verified gone. pending has a live sandbox,
            or the run can still create one. residual has only never_started objects left, owed a reap. unobserved
            has at least one record that could not be established.
          enum:
          - complete
          - pending
          - residual
          - unobserved
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunSandbox'
