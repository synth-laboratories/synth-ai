openapi: 3.1.0
x-synth-launch-contract: 3
info:
  title: Synth API
  version: 1.2.0
  description: Versioned public product API. Internal authority routes and OAuth/MCP retain their own
    protocols. Source implementation and deployment qualification are tracked separately.
  license:
    name: Proprietary
    url: https://usesynth.ai/terms
servers:
- url: https://api.usesynth.ai
security:
- apiKey: []
- clerkSession: []
tags:
- name: account
  description: Account
- name: api-keys
  description: Api Keys
- name: billing
  description: Billing
- name: usage
  description: Usage
- name: limits
  description: Limits
- name: families
  description: Families
- name: runs
  description: Runs
- name: mcp
  description: Mcp
paths:
  /v1/account:
    get:
      tags:
      - account
      operationId: getAccount
      x-synth-scope: "account:read"
      x-synth-retry: "safe_read"
      x-synth-idempotency: "safe_read"
      x-synth-idempotency-key: false
      x-synth-status: implemented
      summary: The caller's org, principal and limits.
      responses:
        '200':
          description: Account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                org:
                  id: 00000000-0000-4000-8000-000000000001
                  name: example
                  personal: false
                  plan: example
                  access_tier: example
                  created_at: '2026-11-04T18:00:00Z'
                principal:
                  org_id: 00000000-0000-4000-8000-000000000001
                  credential_kind: api_key
                  credential_purpose: personal
                  principal_class: example
                  scopes: []
                  permissions: []
                  authorization_version: 1
                  access_tier: example
                limits: []
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '304':
          description: Representation unchanged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-legacy-path: /v1/account
      x-synth-source: core/internal/public/account/http.go
      parameters:
      - name: If-None-Match
        in: header
        schema:
          type: string
      x-synth-mcp-name: account_get
  /v1/account/terms-acceptance:
    post:
      tags:
      - account
      operationId: acceptTerms
      x-synth-scope: "account:write"
      x-synth-retry: "deduplicated"
      x-synth-idempotency: "durable_key"
      x-synth-idempotency-key: true
      x-synth-status: implemented
      x-synth-legacy-path: /v1/account/terms-acceptance
      summary: Record the org's acceptance of a terms version (idempotent per version).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsAcceptanceRequest'
      responses:
        '201':
          description: Acceptance recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsAcceptance'
              example:
                version: '2026-11-04'
                accepted_at: '2026-11-04T18:00:00Z'
                accepted_by: user:00000000-0000-4000-8000-000000000002
                org_id: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '200':
          description: This version was already accepted for the org; the first record is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermsAcceptance'
              example:
                version: '2026-11-04'
                accepted_at: '2026-11-04T18:00:00Z'
                accepted_by: user:00000000-0000-4000-8000-000000000002
                org_id: 00000000-0000-4000-8000-000000000001
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/TermsVersionUnknown'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-source: core/internal/public/account/http.go
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/api-keys:
    get:
      tags:
      - api-keys
      operationId: listApiKeys
      x-synth-scope: "account:read"
      x-synth-retry: "safe_read"
      x-synth-idempotency: "safe_read"
      x-synth-idempotency-key: false
      x-synth-status: implemented
      x-synth-legacy-path: /v1/api-keys
      summary: List the caller's personal and automation keys (session only).
      security:
      - clerkSession: []
      parameters:
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - personal
          - automation
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Keys, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
              example:
                has_more: false
                items: []
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/Problem'
        default:
