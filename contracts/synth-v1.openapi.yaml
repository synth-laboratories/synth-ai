  /.well-known/oauth-authorization-server:
    get:
      tags:
      - mcp
      operationId: getOAuthServerMetadata
      x-synth-scope: "protocol"
      x-synth-retry: "safe_read"
      x-synth-idempotency: "safe_read"
      x-synth-idempotency-key: false
      x-synth-status: implemented
      x-synth-legacy-path: /.well-known/oauth-authorization-server
      summary: RFC 8414 authorization server metadata for hosted MCP.
      security: []
      responses:
        '200':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthServerMetadata'
              example:
                issuer: https://mcp.usesynth.ai/
                authorization_endpoint: https://mcp.usesynth.ai/mcp/oauth/authorize
                token_endpoint: https://mcp.usesynth.ai/mcp/oauth/token
                registration_endpoint: https://mcp.usesynth.ai/mcp/oauth/register
                revocation_endpoint: https://mcp.usesynth.ai/mcp/oauth/revoke
                response_types_supported:
                - code
                grant_types_supported:
                - authorization_code
                - refresh_token
                code_challenge_methods_supported:
                - S256
                token_endpoint_auth_methods_supported:
                - none
                revocation_endpoint_auth_methods_supported:
                - none
                scopes_supported:
                - synth:read
                authorization_response_iss_parameter_supported: true
        '400':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
        default:
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: temporarily_unavailable
      x-synth-source: core/internal/mcpoauth/routes.go
