components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Bearer sk_live_ or sk_test_ API key.
    clerkSession:
      type: apiKey
      in: header
      name: X-Clerk-Session-Token
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RunId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on creating and charging POSTs. Scoped to the caller and operation for 24
        hours; body mismatch returns 422 idempotency_key_reused.
      schema:
        type: string
        maxLength: 128
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque next_cursor from the preceding page.
  responses:
    Problem:
      description: internal error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/internal_error
            title: internal error
            status: 500
            detail: internal error
            instance: urn:request:example
            code: internal_error
            service: synth-backend
            stage: public
            outcome: not_accepted
    AuthenticationRequired:
      description: authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/authentication_required
            title: authentication required
            status: 401
            detail: authentication required
            instance: urn:request:example
            code: authentication_required
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    LaunchForbidden:
