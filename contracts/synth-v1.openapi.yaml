        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-source: core/internal/public/apikeys/http.go
    post:
      tags:
      - api-keys
      operationId: createApiKey
      x-synth-scope: "account:write"
      x-synth-retry: "deduplicated"
      x-synth-idempotency: "durable_key"
      x-synth-idempotency-key: true
      x-synth-status: implemented
      x-synth-legacy-path: /v1/api-keys
      summary: Mint a key. The secret is returned once (session only).
      security:
      - clerkSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintApiKeyRequest'
      responses:
        '201':
          description: Minted key with its one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintedApiKey'
              example:
                key_id: key_AAAAAAAAAAAAAAAAAAAAAA
                prefix: sk_live_
                last4: example
                key_type: example
                is_active: false
                purpose: personal
                name: example
                scopes: []
                authorization_version: 1
                rotation_family_id: key_AAAAAAAAAAAAAAAAAAAAAA
                key: sk_test_000000000000000000000000000000000000000000000000
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
