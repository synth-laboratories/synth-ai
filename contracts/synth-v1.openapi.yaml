        usage_input_tokens:
          type: integer
          format: int64
        usage_output_tokens:
          type: integer
          format: int64
        opening_ledger:
          $ref: '#/components/schemas/Money'
        purchases:
          $ref: '#/components/schemas/Money'
        allowance:
          $ref: '#/components/schemas/Money'
        credits:
          $ref: '#/components/schemas/Money'
        conversion:
          $ref: '#/components/schemas/Money'
        charges:
          $ref: '#/components/schemas/Money'
        refunds:
          $ref: '#/components/schemas/Money'
        adjustments:
          $ref: '#/components/schemas/Money'
        expirations:
          $ref: '#/components/schemas/Money'
        closing_ledger:
          $ref: '#/components/schemas/Money'
        unspent_returned:
          $ref: '#/components/schemas/Money'
        usage_charge:
          $ref: '#/components/schemas/Money'
    BillingHistoryPage:
      allOf:
      - $ref: '#/components/schemas/PageFields'
