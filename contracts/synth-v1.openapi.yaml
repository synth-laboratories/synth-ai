  /v1/usage/summary:
    get:
      tags:
      - usage
      operationId: getUsageSummary
      x-synth-scope: "account:usage:read"
      x-synth-retry: "safe_read"
      x-synth-idempotency: "safe_read"
      x-synth-idempotency-key: false
      x-synth-status: implemented
      x-synth-source: core/internal/public/usage/http.go
      summary: Rollup of the caller's settled charge-usage rows by day, source and key.
      description: |
        A projection of settled `billing.charge_usage` rows, not a separate meter: `total` equals the sum of
        `GET /v1/usage/records` over the same window. `data_through` is the newest settled row in the window
        (null when there is none) and `observed_at` is when this answer was read. `pending` is the org's live
        unsettled holds at `observed_at`; it is not limited to the window. `by_source.sessions` is usage from
        sessions outside a run, and `by_source.unattributed` means attribution is unknown, not "not a run".
        Refusals: `invalid_filter` (422) on an unparsable time, `usage_window_invalid` (422) when `until` is not
        after `since` or the window exceeds 366 days.
      parameters:
      - name: since
        in: query
        required: false
        description: Inclusive RFC 3339 start. Defaults to the start of the current UTC month.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        required: false
        description: Exclusive RFC 3339 end. Defaults to now.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Usage rollup.
          content:
            application/json:
              schema:
