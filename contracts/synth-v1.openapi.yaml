openapi: 3.1.0
info:
  title: Synth API
  version: 1.0.0
  description: Versioned public product API. Internal authority routes and OAuth/MCP retain their own
    protocols. Source implementation and deployment qualification are tracked separately.
  license:
    name: Proprietary
    url: https://usesynth.ai/terms
servers:
- url: https://api.usesynth.ai
security:
- apiKey: []
- clerkSession: []
tags:
- name: account
  description: Account
- name: api-keys
  description: Api Keys
- name: billing
  description: Billing
- name: families
  description: Families
- name: projects
  description: Projects
- name: runs
  description: Runs
- name: mcp
  description: Mcp
paths:
  /v1/account:
    get:
      tags:
      - account
      operationId: getAccount
      x-synth-status: implemented
      summary: The caller's org, principal and limits.
      responses:
        '200':
          description: Account.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                org:
                  id: 00000000-0000-4000-8000-000000000001
                  name: example
                  personal: false
                  plan: example
                  access_tier: example
                  created_at: '2026-11-04T18:00:00Z'
                principal:
                  org_id: 00000000-0000-4000-8000-000000000001
                  credential_kind: api_key
                  credential_purpose: personal
                  principal_class: example
                  scopes: []
                  permissions: []
                  authorization_version: 1
                  access_tier: example
                limits: []
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '304':
          description: Representation unchanged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-legacy-path: /v1/account
      x-synth-source: core/internal/public/account/http.go
      x-synth-scope: account:read
      parameters:
      - name: If-None-Match
        in: header
        schema:
          type: string
      x-synth-mcp-name: account_get
  /v1/api-keys:
    get:
      tags:
      - api-keys
      operationId: listApiKeys
      x-synth-status: implemented
      x-synth-legacy-path: /v1/api-keys
      summary: List the caller's personal and automation keys (session only).
      security:
      - clerkSession: []
      parameters:
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - personal
          - automation
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Keys, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
              example:
                has_more: false
                items: []
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-source: core/internal/public/apikeys/http.go
      x-synth-scope: account:read
    post:
      tags:
      - api-keys
      operationId: createApiKey
      x-synth-status: implemented
      x-synth-legacy-path: /v1/api-keys
      summary: Mint a key. The secret is returned once (session only).
      security:
      - clerkSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintApiKeyRequest'
      responses:
        '201':
          description: Minted key with its one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintedApiKey'
              example:
                key_id: key_AAAAAAAAAAAAAAAAAAAAAA
                prefix: sk_live_
                last4: example
                key_type: example
                is_active: false
                purpose: personal
                name: example
                scopes: []
                authorization_version: 1
                rotation_family_id: key_AAAAAAAAAAAAAAAAAAAAAA
                key: sk_test_000000000000000000000000000000000000000000000000
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-source: core/internal/public/apikeys/http.go
      x-synth-scope: account:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/api-keys/{key_id}:
    delete:
      tags:
      - api-keys
      operationId: revokeApiKey
      x-synth-status: implemented
      x-synth-legacy-path: /v1/api-keys/{key_id}
      summary: Revoke a key (idempotent, session only).
      security:
      - clerkSession: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KeyId'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '204':
          description: Key revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-source: core/internal/public/apikeys/http.go
      x-synth-scope: account:write
    patch:
      tags:
      - api-keys
      operationId: updateApiKey
      x-synth-status: implemented
      x-synth-legacy-path: /v1/api-keys/{key_id}
      summary: Replace a key's scopes (optimistic on authorization_version, session only).
      security:
      - clerkSession: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - scopes
              - expected_version
              properties:
                scopes:
                  type: array
                  maxItems: 32
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Scope'
                expected_version:
                  type: integer
                  minimum: 1
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Updated key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
              example:
                key_id: key_AAAAAAAAAAAAAAAAAAAAAA
                prefix: sk_live_
                last4: example
                key_type: example
                is_active: false
                purpose: personal
                name: example
                scopes: []
                authorization_version: 1
                rotation_family_id: key_AAAAAAAAAAAAAAAAAAAAAA
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-source: core/internal/public/apikeys/http.go
      x-synth-scope: account:write
  /v1/api-keys/{key_id}/rotate:
    post:
      tags:
      - api-keys
      operationId: rotateApiKey
      x-synth-status: implemented
      x-synth-legacy-path: /v1/api-keys/{key_id}/rotate
      summary: Revoke a key and mint its replacement in the same rotation family (session only).
      security:
      - clerkSession: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KeyId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Replacement key with its one-time secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintedApiKey'
              example:
                key_id: key_AAAAAAAAAAAAAAAAAAAAAA
                prefix: sk_live_
                last4: example
                key_type: example
                is_active: false
                purpose: personal
                name: example
                scopes: []
                authorization_version: 1
                rotation_family_id: key_AAAAAAAAAAAAAAAAAAAAAA
                key: sk_test_000000000000000000000000000000000000000000000000
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-source: core/internal/public/apikeys/http.go
      x-synth-scope: account:write
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - mcp
      operationId: getOAuthServerMetadata
      x-synth-status: implemented
      x-synth-legacy-path: /.well-known/oauth-authorization-server
      summary: RFC 8414 authorization server metadata for hosted MCP.
      security: []
      responses:
        '200':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthServerMetadata'
              example:
                issuer: https://api.usesynth.ai/
                authorization_endpoint: https://api.usesynth.ai/mcp/oauth/authorize
                token_endpoint: https://api.usesynth.ai/mcp/oauth/token
                registration_endpoint: https://api.usesynth.ai/mcp/oauth/register
                revocation_endpoint: https://api.usesynth.ai/mcp/oauth/revoke
                response_types_supported:
                - code
                grant_types_supported:
                - authorization_code
                - refresh_token
                code_challenge_methods_supported:
                - S256
                token_endpoint_auth_methods_supported:
                - none
                revocation_endpoint_auth_methods_supported:
                - none
                scopes_supported:
                - synth:read
                authorization_response_iss_parameter_supported: true
        '400':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
        default:
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: temporarily_unavailable
      x-synth-scope: protocol
      x-synth-source: core/internal/mcpoauth/routes.go
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags:
      - mcp
      operationId: getMcpResourceMetadata
      x-synth-status: implemented
      x-synth-legacy-path: /.well-known/oauth-protected-resource/mcp
      summary: RFC 9728 protected resource metadata for /mcp.
      security: []
      responses:
        '200':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResourceMetadata'
              example:
                resource: https://api.usesynth.ai/mcp
                authorization_servers:
                - https://api.usesynth.ai/
                bearer_methods_supported:
                - header
                scopes_supported:
                - synth:read
        '400':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
        default:
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: temporarily_unavailable
      x-synth-scope: protocol
      x-synth-source: core/internal/mcpoauth/routes.go
  /mcp/oauth/register:
    post:
      tags:
      - mcp
      operationId: registerOAuthClient
      x-synth-status: implemented
      x-synth-legacy-path: /mcp/oauth/register
      summary: RFC 7591 dynamic registration of a public (PKCE) client.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientRegistration'
      responses:
        '201':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
              example:
                client_id: synth_client_example
                client_name: Synth CLI
                redirect_uris:
                - http://127.0.0.1:8765/callback
                grant_types:
                - authorization_code
                - refresh_token
                response_types:
                - code
                token_endpoint_auth_method: none
        '400':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
        default:
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: temporarily_unavailable
      x-synth-scope: protocol
      x-synth-source: core/internal/mcpoauth/routes.go
  /mcp/oauth/authorize:
    get:
      tags:
      - mcp
      operationId: authorizeOAuth
      x-synth-status: implemented
      x-synth-legacy-path: /mcp/oauth/authorize
      summary: Store an authorization request and redirect (303) to the console consent page.
      security: []
      responses:
        '303':
          description: Redirect to console consent.
          headers:
            Location:
              schema:
                type: string
                format: uri
              required: true
        '400':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
        default:
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: temporarily_unavailable
      x-synth-scope: protocol
      x-synth-source: core/internal/mcpoauth/routes.go
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
      - name: response_type
        in: query
        required: true
        schema:
          type: string
      - name: code_challenge
        in: query
        required: true
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: resource
        in: query
        required: true
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
  /mcp/oauth/request:
    get:
      tags:
      - mcp
      operationId: readOAuthRequest
      x-synth-status: implemented
      x-synth-legacy-path: /mcp/oauth/request
      summary: Pending authorization request shown on the consent page.
      security: []
      responses:
        '200':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthConsentRequest'
              example:
                client_id: synth_client_example
                client_name: Synth CLI
                scopes:
                - synth:read
                resource: https://api.usesynth.ai/mcp
        '400':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
        default:
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: temporarily_unavailable
      x-synth-scope: protocol
      x-synth-source: core/internal/mcpoauth/routes.go
      parameters:
      - name: request
        in: query
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 128
  /mcp/oauth/consent:
    post:
      tags:
      - mcp
      operationId: decideOAuthConsent
      x-synth-status: implemented
      x-synth-legacy-path: /mcp/oauth/consent
      summary: Approve or deny a request (console origin, Clerk session only).
      security:
      - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthConsentDecision'
      responses:
        '200':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthConsentResult'
              example:
                redirect_uri: http://127.0.0.1:8765/callback?code=example&state=example
        '400':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_request
        default:
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: temporarily_unavailable
      x-synth-scope: protocol
      x-synth-source: core/internal/mcpoauth/routes.go
  /mcp/oauth/token:
    post:
      tags:
      - mcp
      operationId: exchangeOAuthToken
      x-synth-status: implemented
      x-synth-legacy-path: /mcp/oauth/token
      summary: authorization_code (PKCE S256) and refresh_token grants; rotation with reuse detection.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        '200':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthToken'
              example:
                access_token: example
                token_type: Bearer
                expires_in: 3600
                scope: synth:read
                refresh_token: example
        '400':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
