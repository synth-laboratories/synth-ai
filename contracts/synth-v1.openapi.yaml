        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-source: core/internal/public/apikeys/http.go
    patch:
      tags:
      - api-keys
      operationId: updateApiKey
      x-synth-scope: "account:write"
      x-synth-retry: "never"
      x-synth-idempotency: "none"
      x-synth-idempotency-key: false
      x-synth-status: implemented
      x-synth-legacy-path: /v1/api-keys/{key_id}
      summary: Replace a key's scopes (optimistic on authorization_version, session only).
      security:
      - clerkSession: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - scopes
              - expected_version
              properties:
                scopes:
                  type: array
                  maxItems: 32
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Scope'
                expected_version:
                  type: integer
                  minimum: 1
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Updated key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
              example:
                key_id: key_AAAAAAAAAAAAAAAAAAAAAA
                prefix: sk_live_
                last4: example
                key_type: example
                is_active: false
                purpose: personal
                name: example
                scopes: []
                authorization_version: 1
                rotation_family_id: key_AAAAAAAAAAAAAAAAAAAAAA
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
