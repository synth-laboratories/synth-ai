      required:
      - code
      - message
      additionalProperties: false
    McpResponse:
      type: object
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          type:
          - string
          - integer
          - 'null'
        result: {}
        error:
          $ref: '#/components/schemas/McpError'
      required:
      - jsonrpc
      - id
      additionalProperties: false
      oneOf:
      - required:
        - result
        not:
          required:
          - error
          properties:
            error: {}
        properties:
          result: {}
      - required:
        - error
        not:
          required:
          - result
          properties:
            result: {}
        properties:
          error: {}
