      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/launch_requires_sdk_or_mcp
            title: launch requires sdk or mcp
            status: 403
            detail: Runs are created through the SDK or MCP, not a signed-in session.
            instance: urn:request:example
            code: launch_requires_sdk_or_mcp
            service: synth-backend
            stage: authorize
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    InsufficientScope:
      description: insufficient scope
