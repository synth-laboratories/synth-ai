          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
      x-synth-legacy-path: /v1/billing/checkout
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /mcp/oauth/grants:
    get:
      tags:
      - mcp
      operationId: listOAuthGrants
      summary: listOAuthGrants
      security:
      - clerkSession: []
      x-synth-status: implemented
      x-synth-scope: protocol
      x-synth-source: core/internal/mcpoauth/grants.go
      x-synth-legacy-path: /v1/account/oauth-grants
      responses:
        '200':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthGrants'
              example:
                grants: []
                visibility: own
                viewer_role: owner
                observed_at: '2026-11-04T00:00:00Z'
        default:
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolFault'
              example:
                error:
                  code: session_required
        '403':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolFault'
              example:
                error:
                  code: session_required
  /mcp/oauth/grants/{grant_id}:
    delete:
      tags:
      - mcp
      operationId: revokeOAuthGrant
      summary: revokeOAuthGrant
      security:
      - clerkSession: []
      x-synth-status: implemented
      x-synth-scope: protocol
      x-synth-source: core/internal/mcpoauth/grants.go
      x-synth-legacy-path: /v1/account/oauth-grants
      responses:
        '200':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthGrantRevoked'
              example:
                grant_id: 00000000-0000-4000-8000-000000000001
                status: revoked
                outcome: revoked
        default:
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolFault'
              example:
                error:
                  code: session_required
        '403':
          description: Protocol response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolFault'
              example:
                error:
                  code: session_required
      parameters:
      - in: path
        name: grant_id
        required: true
        schema:
          type: string
          format: uuid
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Bearer sk_live_ or sk_test_ API key.
    clerkSession:
      type: apiKey
      in: header
      name: X-Clerk-Session-Token
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RunId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on creating and charging POSTs. Scoped to the caller and operation for 24
        hours; body mismatch returns 422 idempotency_key_reused.
      schema:
        type: string
        maxLength: 128
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque next_cursor from the preceding page.
  responses:
    Problem:
      description: internal error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/internal_error
            title: internal error
            status: 500
            detail: internal error
            instance: urn:request:example
            code: internal_error
            service: synth-backend
            stage: public
            outcome: not_accepted
    AuthenticationRequired:
      description: authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/authentication_required
            title: authentication required
            status: 401
            detail: authentication required
            instance: urn:request:example
            code: authentication_required
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    InsufficientScope:
      description: insufficient scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/insufficient_scope
            title: insufficient scope
            status: 403
            detail: insufficient scope
            instance: urn:request:example
            code: insufficient_scope
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    InvalidRequest:
      description: invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/invalid_request
            title: invalid request
            status: 422
            detail: invalid request
            instance: urn:request:example
            code: invalid_request
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    RateLimitExceeded:
      description: rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/rate_limit_exceeded
            title: rate limit exceeded
            status: 429
            detail: rate limit exceeded
            instance: urn:request:example
            code: rate_limit_exceeded
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
    ServiceUnavailable:
      description: service unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/service_unavailable
            title: service unavailable
            status: 503
            detail: service unavailable
            instance: urn:request:example
            code: service_unavailable
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    IdempotencyKeyReused:
      description: idempotency key reused
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/idempotency_key_reused
            title: idempotency key reused
            status: 422
            detail: idempotency key reused
            instance: urn:request:example
            code: idempotency_key_reused
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    ResourceNotFound:
      description: resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.usesynth.ai/errors/resource_not_found
            title: resource not found
            status: 404
            detail: resource not found
            instance: urn:request:example
            code: resource_not_found
            service: synth-backend
            stage: public
            outcome: not_accepted
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
  schemas:
    Limit:
      type: object
      required:
      - resource
      - metric
      - window
      - cap
      properties:
        resource:
          type: string
          description: 'e.g. container_pool, swarm_run (concurrent_runs: standard 5, max 50, internal
            -1, credits/free 1), included_usage.'
        metric:
          type: string
        window:
          type: string
        cap:
          type: number
          description: -1 means uncapped.
    Org:
      type: object
      required:
      - id
      - name
      - personal
      - plan
      - access_tier
      - created_at
      properties:
        id:
          type: string
          format: uuid
        clerk_org_id:
          type:
          - string
          - 'null'
        name:
          type: string
        personal:
          type: boolean
        plan:
          type: string
        access_tier:
          type: string
        created_at:
          type: string
          format: date-time
    Principal:
      type: object
      required:
      - org_id
      - credential_kind
      - credential_purpose
      - principal_class
      - scopes
      - permissions
      - authorization_version
      - access_tier
      properties:
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        credential_kind:
          type: string
          enum:
          - api_key
          - session
        credential_id:
          type: string
        credential_purpose:
          type: string
          enum:
          - personal
          - automation
          - legacy
        principal_class:
          type: string
        scopes:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        authorization_version:
          type: integer
          minimum: 1
        org_role:
          type: string
          enum:
          - owner
          - admin
          - member
        access_tier:
          type: string
    Account:
      type: object
      required:
      - org
      - principal
      - limits
      properties:
        org:
          $ref: '#/components/schemas/Org'
        principal:
          $ref: '#/components/schemas/Principal'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'
    Scope:
      type: string
      enum:
      - account:billing:read
      - account:read
      - account:usage:read
      - swarms:control
      - swarms:read
      - swarms:run
      - swarms:write
      - account:write
      - account:billing:write
    ApiKey:
      type: object
      required:
      - key_id
      - prefix
      - last4
      - key_type
      - is_active
      - purpose
      - name
      - scopes
      - authorization_version
      - rotation_family_id
      properties:
        key_id:
          $ref: '#/components/schemas/KeyId'
        prefix:
          type: string
          description: Visible prefix; imported inventory can retain its historical prefix.
        last4:
          type: string
        key_type:
          type: string
        is_active:
          type: boolean
        purpose:
          type: string
          enum:
          - personal
          - automation
        name:
          type:
          - string
          - 'null'
        scopes:
          type: array
          items:
            type: string
        authorization_version:
          type: integer
          minimum: 1
        rotation_family_id:
          oneOf:
          - $ref: '#/components/schemas/KeyId'
          - type: 'null'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
    MintedApiKey:
      allOf:
      - $ref: '#/components/schemas/ApiKey'
      - type: object
        required:
        - key
        properties:
          key:
            type: string
            pattern: ^sk_(live|test)_[0-9a-f]{48}$
    MintApiKeyRequest:
      type: object
      additionalProperties: false
      description: Automation keys require name, scopes, expires_at (at most one year) and request_id.
        One active personal key per user and org.
      properties:
        purpose:
          type: string
          enum:
          - personal
          - automation
          default: personal
        name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
        scopes:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Scope'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        request_id:
          type:
          - string
          - 'null'
          format: uuid
    Money:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,12})?$
          examples:
          - '5.00'
        currency:
          type: string
          const: USD
    Limits:
      type: object
      required:
      - maximum_charge
      - wall_time_seconds
      - maximum_tasks
      - maximum_parallel_tasks
      description: maximum_charge is required; explicit null requests operator-funded local execution.
        maximum_parallel_tasks cannot exceed maximum_tasks.
      properties:
        maximum_charge:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        wall_time_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        maximum_tasks:
          type: integer
          minimum: 1
          maximum: 1000
        maximum_parallel_tasks:
          type: integer
          minimum: 1
          maximum: 1000
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        template:
          type: string
        objective:
          type: string
          maxLength: 8192
        code_validation:
          type: object
          additionalProperties: true
    Project:
      type: object
      required:
      - project_id
      - name
      - launch_enabled
      - metadata
      properties:
        project_id:
          $ref: '#/components/schemas/ProjId'
        name:
          type: string
        launch_enabled:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
    Family:
      type: object
      required:
      - id
      - version
      - summary
      - research_binding
      - required_actor_types
      properties:
        id:
          type: string
        version:
          type: string
        summary:
          type: string
        research_binding:
          type: string
        required_actor_types:
          type: array
          items:
            type: string
    FamilyList:
      type: object
      required:
      - families
      properties:
        families:
          type: array
          items:
            $ref: '#/components/schemas/Family'
    LaunchRequest:
      type: object
      additionalProperties: false
      required:
      - project_id
      - limits
      properties:
        message:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 8192
        project_id:
          $ref: '#/components/schemas/ProjId'
        limits:
          $ref: '#/components/schemas/Limits'
        inputs:
          type:
          - object
          - 'null'
          properties:
            files:
              type: array
              maxItems: 32
              items:
                type: object
                required:
                - file_id
                - revision_id
                - project_id
                - digest_sha256
                properties:
                  file_id:
                    type: string
                  revision_id:
                    type: string
                  project_id:
                    $ref: '#/components/schemas/ProjId'
                  digest_sha256:
                    type: string
                    pattern: ^[0-9a-f]{64}$
        providers:
          type:
          - object
          - 'null'
        models:
          type:
          - object
          - 'null'
        method:
          type:
          - object
          - 'null'
        program:
          type: object
          properties:
            id:
              type: string
            version:
              type: string
          required:
          - id
          additionalProperties: false
        profile_overrides:
          $ref: '#/components/schemas/ProfileOverrides'
        resources:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/OwnerResourceRequest'
        labels:
          type: object
          additionalProperties:
            type: string
    OwnerResourceRequest:
      type: object
      additionalProperties: false
      required: [plugin, roles, limits, selection]
      properties:
        plugin:
          type: string
          enum: [rhodes.pool, forge.research]
        version:
          type: integer
          const: 1
          default: 1
        roles:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [planner, worker, reviewer, run_assessor]
        limits:
          $ref: '#/components/schemas/OwnerResourceLimits'
        role_limits:
          type: object
          maxProperties: 4
          propertyNames:
            enum: [planner, worker, reviewer, run_assessor]
          additionalProperties:
            $ref: '#/components/schemas/OwnerResourceLimits'
        selection:
          type: object
      oneOf:
      - properties:
          plugin:
            const: rhodes.pool
          limits:
            required: [spend_micros, rollouts]
            propertyNames:
              enum: [spend_micros, rollouts]
          selection:
            additionalProperties: false
            required: [pool_ids]
            properties:
              pool_ids:
                type: array
                minItems: 1
                maxItems: 8
                uniqueItems: true
                items:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
      - properties:
          plugin:
            const: forge.research
          limits:
            required: [spend_micros, calls]
            propertyNames:
              enum: [spend_micros, calls]
          selection:
            additionalProperties: false
            required: [project_ids]
            properties:
              project_ids:
                type: array
                minItems: 1
                maxItems: 8
                uniqueItems: true
                items:
                  type: string
                  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    OwnerResourceLimits:
      type: object
      minProperties: 1
      maxProperties: 2
      propertyNames:
        enum: [spend_micros, rollouts, calls]
      additionalProperties:
        type: integer
        minimum: 0
        maximum: 9223372036854775807
    ControlRef:
      type: object
      required:
      - operation_id
      - command
      - state
      properties:
        operation_id:
          type: string
        command:
          type: string
          examples:
          - cancel
          - pause
          - resume
        state:
          type: string
          examples:
          - accepted
          - applied
          - quiesced
          - refused
    RunSnapshot:
      type: object
      required:
      - metadata
      - run_id
      - project_id
      - labels
      - labels_revision
      - objectives
      - guidance_coverage
      - state
      - model
      - provider
      - result_available
      - execution_closed
      - accounting_final
      - cleanup_complete
      - problems
      - problems_observed
      - created_at
      - started_at
      - closed_at
      properties:
        metadata:
          type: object
          additionalProperties: true
        method:
          description: Open method projection or null.
        run_id:
          $ref: '#/components/schemas/RunId'
        project_id:
          $ref: '#/components/schemas/ProjId'
        labels:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        labels_revision:
          type: integer
        objectives:
          type:
          - array
          - 'null'
          items: {}
        guidance_coverage:
          type:
          - array
          - 'null'
          items: {}
        state:
          type: string
          description: Known values listed; unknown values are forwarded verbatim.
          examples:
          - queued
          - running
          - pausing
          - paused
          - cancelling
          - completed
          - partial
          - failed
          - cancelled
        model:
          type: string
        provider:
          type: string
        result_available:
          type: boolean
        execution_closed:
          type: boolean
        accounting_final:
          type: boolean
        cleanup_complete:
          type: boolean
        control:
          $ref: '#/components/schemas/ControlRef'
        problems:
          type:
          - array
          - 'null'
          items: {}
        problems_observed:
          type: boolean
        failure:
          description: Open failure projection or null.
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
        profile_overrides:
          $ref: '#/components/schemas/ProfileOverrideReadback'
    PageFields:
      type: object
      required:
      - has_more
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: string
          minLength: 1
    RunPage:
      allOf:
      - $ref: '#/components/schemas/PageFields'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/RunSnapshot'
    RunEvent:
      type: object
      required:
      - event_id
      - run_id
      - sequence
      - kind
      - original_kind
      - usage
      - observed_at
      - approval_id
      properties:
        event_id:
          $ref: '#/components/schemas/EvtId'
        run_id:
          $ref: '#/components/schemas/RunId'
        sequence:
          type: integer
          minimum: 0
        kind:
          type: string
        original_kind:
          type: string
        usage:
          description: Usage facet or null.
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        approval_id:
          type:
          - string
          - 'null'
    EventPage:
      allOf:
      - $ref: '#/components/schemas/PageFields'
      - type: object
        required:
        - items
        - resume_cursor
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/RunEvent'
          resume_cursor:
            type:
            - string
            - 'null'
    RunOutput:
      type: object
      required:
      - run_id
      - output_id
      - state
      - reference
      - filename
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        output_id:
          $ref: '#/components/schemas/OutId'
        state:
          type: string
          examples:
          - available
        reference:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          examples:
          - content_ref: '...'
        filename:
          type: string
    OutputPage:
      allOf:
      - $ref: '#/components/schemas/PageFields'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/RunOutput'
    Plan:
      type: object
      required:
      - plan_id
      - name
      - kind
      - price
      - weekly_included
      - price_state
      - checkout_available
      properties:
        plan_id:
          type: string
          examples:
          - free
          - standard.monthly
          - max.monthly
          - credits.custom
          - internal
        name:
          type: string
        kind:
          type: string
          enum:
          - free
          - recurring
          - credit_pack
          - internal
        interval:
          type: string
          description: Present for recurring plans.
          examples:
          - month
        price_lookup_key:
          type: string
          description: Stripe price lookup key (recurring plans).
          examples:
          - synth_standard_monthly
        price_state:
          type: string
          enum:
          - not_applicable
          - inline
          - present
          - missing
          - ambiguous
          - invalid
          - lookup_failed
          - not_configured
          description: Live Stripe price state; inline = credit packs priced per checkout.
        checkout_available:
          type: boolean
        price:
          $ref: '#/components/schemas/Money'
        weekly_included:
          $ref: '#/components/schemas/Money'
    PlanCatalog:
      type: object
      required:
      - policy_version
      - plans
      - price_checked_at
      properties:
        policy_version:
          type: string
        price_checked_at:
          type: string
          format: date-time
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    Balance:
      type: object
      required:
      - org_id
      - ledger
      - held
      - headroom
      - available
      properties:
        org_id:
          type: string
          format: uuid
        ledger:
          $ref: '#/components/schemas/Money'
        held:
          $ref: '#/components/schemas/Money'
        headroom:
          $ref: '#/components/schemas/Money'
        available:
          $ref: '#/components/schemas/Money'
    BillingHistoryEntry:
      type: object
      required:
      - entry_id
      - cause
      - delta
      - held_delta
      - funding_class
      - hold_kind
      - expires_at
      - created_at
      properties:
        entry_id:
          type: string
        cause:
          type: string
          enum:
          - grant
          - hold
          - settle
          - release
          - refund
          - clawback
          - adjustment
          - expire
          - conversion
          - restore
        funding_class:
          type:
          - string
          - 'null'
          enum:
          - included
          - purchased
          - promotional
          - operator
          - null
        hold_kind:
          type:
          - string
          - 'null'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        refund:
          description: Unspent-hold refund of a canceled/failed run (cause refund with a typed refund_cause);
            null otherwise.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RefundDetail'
        usage:
          description: Usage behind this charge (usage and charge are first class); null for movements
            without metered usage.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ChargeUsage'
        delta:
          $ref: '#/components/schemas/Money'
        held_delta:
          $ref: '#/components/schemas/Money'
    RefundDetail:
      type: object
      required:
      - refund_cause
      - run_id
      - held
      - charged
      - refunded
      - run_usage
      properties:
        refund_cause:
          type: string
          enum:
          - run_canceled
          - run_failed
          - run_expired
          - launch_failed
        run_id:
          $ref: '#/components/schemas/RunId'
        run_usage:
          description: The run's settled usage (tokens, compute) when its settlement is recorded.
          oneOf:
          - type: 'null'
          - type: object
            properties:
              input_tokens:
                type: integer
              cached_input_tokens:
                type: integer
              output_tokens:
                type: integer
              reasoning_tokens:
                type: integer
              compute:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    quantity:
                      type: number
                    unit:
                      type: string
        held:
          $ref: '#/components/schemas/Money'
        charged:
          $ref: '#/components/schemas/Money'
        refunded:
          $ref: '#/components/schemas/Money'
    ChargeUsage:
      type: object
      required:
      - run_id
      - kind
      - ref
      - charge
      - units
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        kind:
          type: string
          enum:
          - gateway
          - rollout
          - other
        ref:
          type: string
          description: Gateway receipt id or usage fact id.
        units:
          type: object
          properties:
            input_tokens:
              type: integer
              minimum: 0
            cached_input_tokens:
              type: integer
              minimum: 0
            output_tokens:
              type: integer
              minimum: 0
            reasoning_tokens:
              type: integer
              minimum: 0
            meter_kind:
              type: string
              examples:
              - container_pool_wall_seconds
            quantity:
              type: number
              minimum: 0
            quantity_unit:
              type: string
              examples:
              - second
        charge:
          $ref: '#/components/schemas/Money'
    BillingStatementPage:
      allOf:
      - $ref: '#/components/schemas/PageFields'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/BillingStatement'
    BillingStatement:
      type: object
      additionalProperties: false
      required:
