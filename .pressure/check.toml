scope = "repo"

[[checks]]
id = "native_contribution_author_contract"
description = "Private author tools retain typed scope, exact intent and credential-free upload regressions"
severity = "error"
file_contains = [
  { path = "synth_ai/mcp/contribution_upload.py", pattern = "MAXIMUM_ARCHIVE_BYTES = 4 * 1024 * 1024" },
  { path = "tests/mcp/test_contribution_owner_tools.py", pattern = "test_author_protocol_preserves_exact_intent_scope_and_retry_key" },
  { path = "tests/mcp/test_contribution_upload_tools.py", pattern = "test_upload_observation_excludes_transfer_capabilities" },
  { path = "tests/mcp/test_contribution_upload_tools.py", pattern = "test_archive_strict_encoding_bound_and_closed_authority" },
]
remedy = "Restore the author/upload contract regressions and run the SDK suite plus generated catalog check before updating any native consumer."
