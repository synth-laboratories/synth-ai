[project]
name = "synth-ai"
version = "0.23.0"
description = "Synth SDK for Index, Swarms, account access, and hosted MCP"
keywords = ["synth", "index", "search", "citations", "swarms", "mcp", "sdk"]
authors = [{name = "Synth AI", email = "josh@usesynth.ai"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typing-extensions>=4.12,<5",
    # Live SDK runtime
    # Contract generation is qualified against this exact schema serializer.
    "pydantic==2.12.5",
    "httpx>=0.28.1,<1",
]

[project.scripts]
synth-ai = "synth_ai.cli_auth:main"
synth-ai-mcp = "synth_ai.mcp_entrypoint:main"

[project.urls]
Homepage = "https://github.com/synth-laboratories/synth-ai"
Repository = "https://github.com/synth-laboratories/synth-ai"
Issues = "https://github.com/synth-laboratories/synth-ai/issues"

[project.optional-dependencies]
mcp = [
    "mcp>=1.30,<2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synth_ai", "synth_ai.*"]
exclude = [
    "docs*",
    "tests*",
    "scripts*",
    "private_tests*",
    "synth_ai.*tests*",
    "synth_ai.*units*",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.exclude-package-data]
"synth_ai" = [
    "**/tests/**",
    "**/units/**",
]

[tool.setuptools.package-data]
"synth_ai" = [
    "py.typed",
]

[tool.ruff]
# Lint/format: package `synth_ai/`. Type-check: `ty` scoped to the same tree — [tool.ty.src].
line-length = 100
target-version = "py311"
src = ["synth_ai"]
extend-exclude = [
    ".venv",
    ".tmp",
    "**/*.ipynb",
    "demos",
    "dev",
    "docs",
    "scripts",
    "tests",
    "private_tests",
    "old",
    "tauri",
    "temp",
    "traces",
    "traces_*",
    "synth_ai.db",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "YTT", "B", "C4", "T10", "SIM"]
ignore = [
    "E501",  # Line too long
    "B008",  # Do not perform function call in argument defaults
    "UP035", # Don't require `from __future__ import annotations` (not needed in 3.11+)
    "UP006", # Allow typing.Tuple
    "UP045", # Allow Optional[...] annotations
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["N999"]
"**/__main__.py" = ["N999"]

# Type-check configuration lives in ty.toml, which takes precedence over any
# [tool.ty.*] here.

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "twine>=4.0.0",
    "jsonschema>=4.18,<5",
    "ruff==0.17.0",
    "ty==0.0.86",
    "httpx>=0.28.1,<1",
    "mdxify>=0.2.0",
]
