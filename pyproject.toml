[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "synth-ai"
version = "0.30.0"
description = "Typed Synth public API, CLI and MCP client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.11,<3", "typing-extensions>=4.12"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
synth = "synth_ai.cli:main"
synth-ai = "synth_ai.cli:main"
synth-ai-mcp = "synth_ai.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyyaml>=6", "types-PyYAML", "jsonschema>=4", "ruff>=0.17.3", "ty>=0.0.99", "build>=1.2", "twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["synth_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ty.src]
include = ["synth_ai", "scripts", "typing_tests/accepted.py"]

[tool.ty.rules]
all = "error"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ANN", "PGH", "TRY002"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
