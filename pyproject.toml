[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "synth-ai"
version = "0.27.0"
description = "Typed Synth public API, CLI and MCP client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.11,<3", "typing-extensions>=4.12"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
synth = "synth_ai.cli:main"
synth-ai = "synth_ai.cli:main"
synth-ai-mcp = "synth_ai.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyyaml>=6", "types-PyYAML", "jsonschema>=4", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["synth_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["synth_ai"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
