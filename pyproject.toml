[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "synth-ai"
version = "0.42.0"
description = "Typed Synth public API, CLI and MCP client"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.11,<3", "typing-extensions>=4.12"]

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2", "jsonschema>=4"]

[project.urls]
Homepage = "https://www.usesynth.ai"
Documentation = "https://www.usesynth.ai/docs"
Repository = "https://github.com/synth-laboratories/synth-ai"
Changelog = "https://github.com/synth-laboratories/synth-ai/blob/main/CHANGELOG.md"
Issues = "https://github.com/synth-laboratories/synth-ai/issues"

[project.scripts]
synth = "synth_ai.cli:main"
synth-ai = "synth_ai.cli:main"
synth-ai-mcp = "synth_ai.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
    "types-PyYAML",
    "jsonschema>=4",
    "ruff>=0.17.3",
    "ty>=0.0.99",
    "build>=1.2",
    "twine>=6",
    "playwright>=1.56,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["synth_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["acceptance: customer-path drivers; runtime cases require an explicit owned cached target"]

[tool.ty.src]
include = ["synth_ai", "scripts", "examples", "tests", "typing_tests/accepted.py"]

[tool.ty.rules]
all = "error"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
    "ANN",
    "PGH",
    "TRY002",
    "SIM",
    "C4",
    "PT",
    "ASYNC",
    "S",
    "BLE001",
    "T20",
    "D",
    "TID252",
    "TC",
    "SLF001",
]
ignore = [
    "E501",
    "ASYNC109",  # Public async API methods expose explicit `timeout` parameters.
    "S101",      # SynthStyle uses `assert` for production invariants and pytest assertions.
    "D100",      # Enforce docstring formatting without mandating docstrings on every symbol
    "D101",      # (which would exceed the 580 KiB SDK source budget).
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D205",
    "D213",
    "D401",
]

[tool.ruff.lint.per-file-ignores]
"synth_ai/cli.py" = ["T20"]
"synth_ai/_cli_run.py" = ["T20"]
"synth_ai/_cli_view.py" = ["TC001"]  # SavedOutput(WireModel) evaluates model fields at runtime.
"synth_ai/swarms.py" = ["TC001"]  # gen_sync.py parses top-level _generated.models imports.
"synth_ai/account.py" = ["TC001"]
"synth_ai/billing.py" = ["TC001"]
"synth_ai/_sync.py" = ["TC001", "TC002", "TC003"]  # Generated by scripts/gen_sync.py.
"synth_ai/_generated/**" = ["TC001", "TC002", "TC003", "D", "S105"]  # Generated by scripts/gen_contract.py.
"scripts/**" = ["T20", "S603", "S607"]
"examples/**" = ["T20"]
"tests/**" = ["ANN", "T20", "S105", "S106", "S108", "S603", "S607", "PT011", "PT018", "SIM117", "SLF001", "TC001", "TC002", "TC003"]
"typing_tests/**" = ["T20", "TC001", "TC002", "TC003"]
