# CI workflow for pull requests, release-candidate pushes, and manual checks.
# Runs lint, type check, tests, and validation checks in parallel.
# Keep jobs in alphabetical order.

name: CI

on:
  push:
    branches: [main, nightly, dev]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs on same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check README Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"
          # Check if this is a dev version
          if [[ "$VERSION" == *".dev"* ]]; then
            echo "is_dev=true" >> $GITHUB_OUTPUT
          else
            echo "is_dev=false" >> $GITHUB_OUTPUT
          fi
      - name: Check README version matches
        if: steps.get_version.outputs.is_dev == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          README_BADGE=$(grep -o 'PyPI-.*-orange' README.md | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' || echo "")
          README_INSTALL=$(grep -o 'synth-ai==[0-9]\+\.[0-9]\+\.[0-9]\+' README.md | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' | head -1 || echo "")

          echo "pyproject.toml version: $VERSION"
          echo "README badge version: $README_BADGE"
          echo "README install version: $README_INSTALL"

          if [ "$README_BADGE" != "$VERSION" ]; then
            echo "❌ README badge version ($README_BADGE) does not match pyproject.toml ($VERSION)"
            exit 1
          fi

          if [ "$README_INSTALL" != "$VERSION" ]; then
            echo "❌ README install version ($README_INSTALL) does not match pyproject.toml ($VERSION)"
            exit 1
          fi

          echo "✅ README version matches pyproject.toml ($VERSION)"
      - name: Skip README check for dev versions
        if: steps.get_version.outputs.is_dev == 'true'
        run: |
          echo "⏭️ Skipping README version check for dev version: ${{ steps.get_version.outputs.version }}"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: synth-ai
      # The reference build lives in the docs repo and the docstring manifest in
      # testing, both since 2026-07-29. Neither is public, so both checkouts are
      # best-effort and the job skips rather than failing when they are absent.
      - name: Checkout docs repo
        id: checkout_docs
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: synth-laboratories/docs
          path: docs
      - name: Checkout testing repo
        id: checkout_testing
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: synth-laboratories/testing
          path: testing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - name: Sync dev dependencies
        working-directory: synth-ai
        run: uv sync --group dev
      - name: Detect sibling checkouts
        id: siblings
        run: |
          if [ -f docs/scripts/generate_sdk_reference.py ] && [ -d testing/specifications/sdk ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate SDK reference and check docstrings
        if: steps.siblings.outputs.available == 'true'
        working-directory: synth-ai
        run: make docs-check
      - name: Skip unavailable docs build
        if: steps.siblings.outputs.available != 'true'
        run: |
          echo "Docs build needs the private docs and testing checkouts; unavailable here."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - name: Sync dev dependencies
        run: uv sync --group dev
      # check_no_rust_sdk.py moved to the testing repo with the other SDK gates
      # on 2026-07-29; the tests job runs it there, where that checkout exists.
      - name: Run ruff format check
        run: uv run ruff format --check
      - name: Run ruff check
        run: uv run ruff check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private SDK pytest suite
        id: checkout_sdk_tests
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: synth-laboratories/testing
          path: testing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - name: Sync dev dependencies
        run: uv sync --group dev
      - name: Smoke test Research MCP registry
        run: |
          uv run python - <<'PY'
          from synth_ai.mcp.research.server import ResearchMcpServer

          stable = ResearchMcpServer()
          advanced = ResearchMcpServer(include_advanced_tools=True)
          stable_names = stable.available_tool_names()
          advanced_names = advanced.available_tool_names()
          intern_names = {name for name in stable_names if "research_intern" in name}

          assert len(intern_names) == 22, intern_names
          assert not any(name.startswith("smr_") for name in stable_names)
          assert not any(name.startswith("smr_") for name in advanced_names)
          for canonical_name in intern_names:
              legacy_name = f"smr_{canonical_name.removeprefix('research_')}"
              assert stable.get_tool_definition(legacy_name) is stable.get_tool_definition(
                  canonical_name
              )
          PY
      - name: Detect SDK pytest suite
        id: sdk_tests
        run: |
          if [ -d testing/backend/unit/synth_ai_sdk ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run SDK pytest suite
        if: steps.sdk_tests.outputs.available == 'true'
        env:
          SYNTH_AI_DIR: ${{ github.workspace }}
        run: |
          uv run python testing/scripts/check_sdk_architecture.py
          uv run python testing/scripts/check_no_rust_sdk.py
          uv run python testing/scripts/check_research_openapi_contract.py
          uv run python testing/scripts/check_research_migration_boundaries.py
          uv run python testing/scripts/validate_synth_ai_contract.py
          uv run --group dev pytest --confcutdir=testing/backend/unit/synth_ai_sdk testing/backend/unit/synth_ai_sdk -v --maxfail=1
      - name: Skip unavailable private SDK pytest suite
        if: steps.sdk_tests.outputs.available != 'true'
        run: |
          echo "Private SDK pytest suite is unavailable in this GitHub Actions context."

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
      - name: Sync dev dependencies
        run: uv sync --group dev
      - name: Run ty check
        run: uv run ty check --respect-ignore-files --ignore invalid-return-type --ignore unresolved-attribute --ignore unresolved-import --ignore deprecated --ignore invalid-argument-type --ignore not-iterable --ignore unused-ignore-comment --ignore unknown-argument --ignore possibly-missing-attribute --ignore invalid-assignment
