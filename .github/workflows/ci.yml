name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra mcp
      - run: uv run ruff check synth_ai scripts tests
      - run: uv run ruff format --check synth_ai scripts tests
      - run: uv run ty check
      - run: uv run python scripts/lint_standards.py
      - run: uv run python scripts/gen_contract.py --check && uv run python scripts/gen_sync.py --check
      - run: uv run pytest -q
      - run: uv build && uv run twine check dist/*
      - run: uv run python scripts/check_package.py
