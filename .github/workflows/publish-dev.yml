name: Auto-publish to PyPI

# pyproject.toml always holds the STABLE version. The branch decides what is
# actually published:
#
#   push to dev   ->  <base>.dev<run_number>   prerelease, pip ignores it by default
#   push to main  ->  <base>                   stable release
#
# So a version bump is a single edit that flows dev -> main without being touched
# again. Installing a dev build takes an explicit opt-in -- use an exact pin:
#
#   pip install synth-ai==0.17.5.dev42
#
# Not `pip install --pre synth-ai`. `--pre` is not scoped to this package: it lets
# pip take prereleases of every dependency too. Doing that on 2026-07-30 pulled
# httpx 1.0.dev3, which has no `httpx.HTTPError`, and `from synth_ai import
# SynthClient` failed with an AttributeError that looked like a broken release. An
# exact `==` pin needs no `--pre` and leaves dependency resolution alone.
#
# This split is enforced in the check-version job, not by convention: main refuses
# a .dev version, and dev synthesizes one rather than publishing pyproject's
# number verbatim. Until 2026-07-29 it did publish verbatim, so a push to dev
# shipped a stable release to PyPI while this comment claimed otherwise.
on:
  workflow_dispatch:
  push:
    branches: [main, dev]

permissions:
  contents: write
  id-token: write

# Publishes must never race: a second push while one publish is in flight
# waits instead of double-uploading.
concurrency:
  group: publish-pypi-synth-ai
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needs_publish: ${{ steps.check.outputs.needs_publish }}
      version: ${{ steps.local.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure jq (PyPI JSON)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y jq
          fi

      - name: Resolve the version to publish
        id: local
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(grep '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "(.*)"/\1/')
          echo "base=$BASE" >> $GITHUB_OUTPUT

          # pyproject holds the *stable* number. What gets published depends on the
          # branch, and the difference is not cosmetic: before this, a push to dev
          # published pyproject's version verbatim, so dev shipped stable releases
          # to PyPI. The header has always claimed dev publishes prereleases; this
          # is that claim implemented.
          case "$BRANCH" in
            main)
              if printf '%s' "$BASE" | grep -q '\.dev'; then
                echo "::error::main publishes stable versions only, but pyproject says $BASE"
                exit 1
              fi
              VERSION="$BASE"
              ;;
            *)
              if printf '%s' "$BASE" | grep -q '\.dev'; then
                VERSION="$BASE"
              else
                # PEP 440 orders X.Y.Z.devN before X.Y.Z, so promoting the same
                # number to stable from main later is still an increase. run_number
                # is monotonic per workflow, which is what PyPI needs: it refuses a
                # re-upload of a filename, so each dev push needs a fresh N.
                VERSION="${BASE}.dev${RUN_NUMBER}"
              fi
              ;;
          esac
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Branch $BRANCH -> publishing $VERSION (pyproject base $BASE)"

      - name: Check if publish needed
        id: check
        run: |
          LOCAL="${{ steps.local.outputs.version }}"
          BASE="${{ steps.local.outputs.base }}"
          # Fail closed: a metadata lookup failure must fail this job, never
          # be read as "version absent" (which would publish on a PyPI blip).
          # Bounded retry distinguishes a transient outage from real absence.
          META=""
          for attempt in 1 2 3; do
            if META=$(curl -fsSL --max-time 30 https://pypi.org/pypi/synth-ai/json); then
              break
            fi
            META=""
            echo "PyPI metadata fetch failed (attempt $attempt/3); retrying in 10s"
            sleep 10
          done
          if [ -z "$META" ]; then
            echo "::error::PyPI metadata unavailable after 3 attempts; refusing to decide publish"
            exit 1
          fi
          if ! printf '%s' "$META" | jq -e \
               'type == "object" and (.releases | type == "object")' >/dev/null; then
            echo "::error::PyPI metadata is malformed; refusing to decide publish"
            exit 1
          fi
          # A dev build whose base is already released sorts *below* that release,
          # so it would be a prerelease of something that already shipped. That is
          # a stale pyproject, not something to paper over with a higher run number.
          if [ "$LOCAL" != "$BASE" ] \
             && printf '%s' "$META" | jq -e --arg v "$BASE" '.releases | has($v)' >/dev/null; then
            echo "::error::$BASE is already on PyPI, so $LOCAL would be a prerelease of a released version. Bump the version in pyproject.toml (and both README pins)."
            exit 1
          fi
          # Check the EXACT release, not .info.version (latest stable): exact
          # lookup is correct for both stable and .dev versions.
          if printf '%s' "$META" | jq -e --arg v "$LOCAL" '.releases | has($v)' >/dev/null; then
            echo "needs_publish=false" >> $GITHUB_OUTPUT
            echo "Version $LOCAL already on PyPI - skipping publish"
          else
            echo "needs_publish=true" >> $GITHUB_OUTPUT
            echo "Version $LOCAL not on PyPI - will publish"
          fi

  build-distributions:
    needs: check-version
    if: needs.check-version.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4

      # This is a separate job with its own checkout, so pyproject here still
      # holds the stable base. Stamp the resolved version in before building or
      # the artifacts carry the wrong number -- and on dev that means publishing a
      # stable release. Not committed; it exists only for this build.
      - name: Stamp the resolved version into pyproject
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          if not version:
              raise SystemExit("no version resolved by check-version")
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          stamped, count = re.subn(
              r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1
          )
          if count != 1:
              raise SystemExit(f"expected one version line in pyproject.toml, found {count}")
          path.write_text(stamped, encoding="utf-8")
          print(f"building {version}")
          PY

      - name: Build wheel and sdist
        run: |
          uv sync --group dev
          uv run python -m build

      - name: Verify distributions
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          ls -1 dist
          ls dist/*.whl
          ls dist/*.tar.gz
          # The filename is the only place the published version is visible before
          # upload. Check it, so a stamping failure cannot ship the wrong number.
          if ! ls dist/synth_ai-"$VERSION"-py3-none-any.whl >/dev/null 2>&1; then
            echo "::error::built artifacts are not version $VERSION:"; ls -1 dist
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  publish:
    needs: [check-version, build-distributions]
    if: needs.check-version.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/synth-ai/
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  create-release:
    needs: [check-version, publish]
    if: needs.check-version.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release (for dev versions)
        if: contains(needs.check-version.outputs.version, '.dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: synth-ai ${{ needs.check-version.outputs.version }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Create GitHub release (for stable versions)
        if: ${{ !contains(needs.check-version.outputs.version, '.dev') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: synth-ai ${{ needs.check-version.outputs.version }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
