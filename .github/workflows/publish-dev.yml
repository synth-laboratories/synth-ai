name: Publish qualified SDK
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked --extra mcp
      - run: uv run python -c 'import os, synth_ai; assert os.environ["GITHUB_REF_NAME"] == "v" + synth_ai.__version__'
      - run: uv run python scripts/check_type_contracts.py
      - run: uv run python scripts/lint_standards.py
      - run: uv run ruff check synth_ai scripts tests typing_tests && uv run ty check && uv run pytest -q
      - run: uv build && uv run twine check dist/* && uv run python scripts/check_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
