# Canonical gitleaks configuration (SYN-5915 / SYN-5955).
title = "synth-dev gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allowlist synthetic test fixtures, placeholder variables, and SHA-256 digests"
paths = [
  '''^tests/''',
  '''test_.*\.py$''',
  '''_test\.go$''',
  '''\.lock$''',
  '''\.lock\.json$''',
]
regexes = [
  '''\$\{[A-Z0-9_]+\}''',
  '''REDACTED''',
  '''example[-_]?token''',
  '''dummy[-_]?secret''',
]

[[rules]]
id = "synth-env-secret-assignment"
description = "Literal value assigned to an env name ending in a secret suffix"
regex = '''(?m)^[ \t]*(?:export[ \t]+)?[A-Z][A-Z0-9_]*(?:AUTHORIZATION_KEY|SIGNING_KEY|SECRET_KEY|API_KEY|_TOKEN|_SECRET|_PASSWORD)[ \t]*=[ \t]*["']?([A-Za-z0-9+/_=.\-]{16,})["']?[ \t]*$'''
secretGroup = 1
path = '''(?i)(^|/)[^/]*\.env(\.[a-z0-9_-]+)?$'''
